name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: taskpilot-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy TaskPilot to AWS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          AWS_DEPLOY_SSH_KEY: ${{ secrets.AWS_DEPLOY_SSH_KEY }}
          AWS_KNOWN_HOSTS: ${{ secrets.AWS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AWS_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AWS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy the merged main branch
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_DEPLOY_USER: ${{ secrets.AWS_DEPLOY_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$AWS_DEPLOY_USER@$AWS_HOST" '
            set -e
            cd /opt/taskpilot/taskpilot-saas
            GIT_SSH_COMMAND="ssh -i /home/ubuntu/.ssh/taskpilot -o IdentitiesOnly=yes" git fetch origin main
            if git show-ref --verify --quiet refs/heads/main; then
              git checkout main
            else
              git checkout --track -b main origin/main
            fi
            bash scripts/deploy-aws.sh
          '

      - name: Check the deployed API
        env:
          TASKPILOT_API_URL: ${{ secrets.TASKPILOT_API_URL }}
        run: |
          for attempt in {1..12}; do
            if curl --fail --show-error --silent "$TASKPILOT_API_URL/api/health"; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then
              echo "API is restarting; retrying in 5 seconds..."
              sleep 5
            fi
          done
          exit 1
